# The official release records on GitHub Pages (update.pages in
# config.toml): releases.json, channels/<id>.json, device.json (the resolved
# config.toml, read by the exynos-linux site), sysupdate-public-key.asc and
# index.html, generated by ci/pages from the GitHub releases and their
# signed SHA256SUMS. Rebuilt after every image or boot-chain publish and
# every 6 hours, so it never lags the releases.
#
# Settings > Pages > Source: GitHub Actions. Optional secret
# SITE_DISPATCH_TOKEN (fine-grained, Contents: read and write on
# <owner>/<owner>.github.io) tells the org site to rebuild right away.
name: pages

on:
  workflow_run:
    workflows: [images, bootchain]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "config.toml"
      - "ci/pages"
      - "pmos/sysupdate-public-key.asc"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: scripts/config check
      - id: gate
        run: |
          # the template has no key and no releases: nothing to publish
          echo "port=$([ "$(scripts/config get project.template)" = true ] && echo no || echo yes)" >> "$GITHUB_OUTPUT"
      - name: Generate the site
        if: steps.gate.outputs.port == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/pages site
      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.port == 'yes'
        with:
          path: site
    outputs:
      port: ${{ steps.gate.outputs.port }}

  deploy:
    needs: build
    if: needs.build.outputs.port == 'yes'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Tell the org site
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ -n "$TOKEN" ] || { echo "no SITE_DISPATCH_TOKEN: the org site picks this up on its next scheduled build"; exit 0; }
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$OWNER.github.io/dispatches" \
            -d '{"event_type":"device-records-updated","client_payload":{"repo":"${{ github.repository }}"}}'
