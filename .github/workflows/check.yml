# Every push and pull request: the config, the scripts and the offline
# tests. Nothing here needs a device, a secret or the network beyond
# apt and GitHub.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -yq shellcheck
      - name: config.toml
        run: scripts/config check
      - name: Config reader tests
        run: python3 -I tests/config/test_config.py
      - name: Shell syntax and shellcheck
        run: |
          set -eu
          # every tracked shell script: *.sh and anything with a sh/bash shebang
          # not the vendored U-Boot and uniLoader trees: they have their own checks
          files=$(git ls-files -- . ':!bootchain/u-boot' ':!bootchain/uniLoader' | while read -r f; do
            [ -f "$f" ] || continue
            case $f in *.sh) echo "$f"; continue ;; esac
            head -1 "$f" | grep -qE '^#!.*[/ ](ba)?sh$' && echo "$f"
          done)
          for f in $files; do bash -n "$f"; done
          # shellcheck disable=SC2086
          shellcheck -x -S warning $files
      - name: Python syntax
        run: |
          git ls-files -- '*.py' ':!bootchain/u-boot' ':!bootchain/uniLoader' | xargs -r python3 -m py_compile
          for f in ci/pages scripts/config scripts/init-device scripts/aport-checksum; do python3 -m py_compile "$f"; done
      - name: No unfilled template values in a port
        run: |
          [ "$(scripts/config get project.template)" = true ] && exit 0
          ! git grep -nE '@(VENDOR|CODENAME|DEVICE_ID|SOC|MODEL|DEVICE_NAME)@' -- ':!docs/PORTING.md' ':!scripts/init-device'

  # the installer's offline suite needs the Android image tools (mkbootimg,
  # avbtool, lpmake, simg2img): Fedora's android-tools has them all
  installer:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Tools
        run: |
          dnf install -yq git android-tools dosfstools util-linux mtools zstd lz4 \
            gnupg2 python3 e2fsprogs which findutils diffutils procps-ng iproute openssl
      - uses: actions/checkout@v5
      - name: Installer tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tests/installer/run.sh
