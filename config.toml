# The public configuration of this device port.
#
# Everything in this file is public: it is published with every Pages build
# as device.json, the exynos-linux.github.io site and the installer read it,
# and anyone may copy it. Never put a secret here. The image signing key is
# the SYSUPDATE_SIGNING_KEY repository secret (docs/RELEASES.md).
#
# Every key is documented in docs/CONFIG.md. Values marked "derived" may be
# left out; scripts/config fills them in (scripts/config json shows the
# result). Read it from code with scripts/config, never by parsing it again.

schema = 1

[project]
# The template itself: CI checks the plumbing but builds and publishes
# nothing. scripts/init-device sets this to false.
template = true
# owner/name on GitHub. CI uses $GITHUB_REPOSITORY when it is set, so a
# fork publishes to itself.
repo = "exynos-linux/device-template"
# Shown on the site and in release notes.
title = "Device template"
maintainers = ["@exynos-linux"]
community = "https://discord.gg/exynos-linux"
license = "GPL-2.0-only"

[device]
# postmarketOS naming: the device is "<vendor>-<codename>" (derived: id).
vendor = "vendor"
codename = "codename"
name = "Example tablet"
models = ["SM-XXXXX"]
form_factor = "tablet"      # tablet | phone | other
arch = "aarch64"
soc = "exynosxxxx"          # lower case, as in the kernel's DT file names
soc_name = "Exynos XXXX"
# bring-up: nothing published for users yet; testing: dev channel only;
# stable: release channel with device-verified builds (pmos/VERIFIED).
status = "bring-up"

[android]
# What the installer checks on the tablet's stock Android (adb getprop).
product_device = "codename"           # ro.product.device
# Samsung's firmware version in file names and ro.build.PDA (a regex).
firmware_pattern = "XXXX[A-Z0-9]{8}"
# The firmware the boot chain was tested on: the installer warns on others.
tested_firmware = ""
tested_bootloader_rev = ""
# Model for tools/fusdl.py (Samsung's firmware server); "" = not offered.
fus_model = ""
# How Samsung formats userdata (the stock AP userdata.img), for
# ./setup.sh restore-android: mkfs.f2fs options (at most 5 words, the
# console runs at most 7 arguments) and the f2fs superblock feature word
# they give (hex). "" = restore-android is not offered. E.g. for a stock
# 4.9 kernel: "-gandroid -Oencrypt,extra_attr,project_quota,quota,verity
# -t0 -ldata" and "0x499".
userdata_f2fs_options = ""
userdata_f2fs_features = ""

[kernel]
# derived: linux-postmarketos-<device.soc>. The aport
# pmos/aports/device/testing/<package>/APKBUILD is the source of truth for
# the upstream base (_base) and our patch.
package = ""

[images]
# postmarketOS release the images follow (edge or vYY.MM).
release = "edge"
# postmarketOS UIs to build, one image and one update channel each
# (pmaports main/postmarketos-ui-<id>). A tablet updates within its UI.
uis = ["phosh", "gnome"]
default_ui = "phosh"
# Added to every image (comma free names).
extra_packages = ["postmarketos-base-ui-audio-backend-pipewire"]
# Added to dev images only: the USB debug layer (root over USB, no password).
dev_packages = ["duranium-usb-debug", "duranium-usb-debug-adb"]
# A release image must contain none of these: package names (regex) and
# file name parts (regex) of the debug layer. ci/check-image enforces it.
debug_package_regex = "^(duranium-usb-debug(-adb|-initramfs)?)$"
debug_file_regex = "duranium-usb-debug|duranium-debug-"

[ui.phosh]
title = "Phosh"
description = "The phone and tablet shell from the GNOME family."

[ui.gnome]
title = "GNOME"
description = "The GNOME desktop, with a touch-friendly setup."

[channels]
# Publish the development channels (USB debug layer) on every build.
dev = true
# Publish the release channels; only builds of a device-verified export
# (pmos/VERIFIED) ever reach them.
release = true
# Versions each channel keeps (the newest and the one before it).
keep = 2

[upstream]
duranium_build = "https://gitlab.postmarketos.org/postmarketOS/duranium-build.git"
pmaports = "https://gitlab.postmarketos.org/postmarketOS/pmaports.git"
# postmarketOS's newest published Duranium version (their image build):
# a change here starts a rebuild (ci/state).
version_url = "https://duranium.nura.eco/images/mkosi.version"

[update]
# Where tablets fetch updates (systemd-sysupdate) and the installer images.
# derived: https://github.com/<project.repo>/releases/download/
base = ""
# The release records (GitHub Pages of this repo).
# derived: https://<owner>.github.io/<name>
pages = ""
# The public half of the signing key (scripts/new-signing-key makes it).
public_key = "pmos/sysupdate-public-key.asc"
# Its fingerprint, for humans and the installer (scripts/new-signing-key).
fingerprint = ""
# The file in every image that names its update channel.
# derived: /usr/lib/<device.id>/update-channel
channel_file = ""

[bootchain]
# A boot-chain payload release for the installer (bootchain/, ci/bootchain).
enabled = false
# derived: <device.id>_bootchain
tag = ""
# The board in the vendored trees (bootchain/build.sh).
# derived: <codename>_defconfig (bootchain/u-boot/configs/)
u_boot_defconfig = ""
# derived: <codename>_chain_defconfig (bootchain/uniLoader/configs/)
uniloader_defconfig = ""
# derived: exynos/<soc>-<codename>.dtb (the bring-up Linux's DTB)
dtb = ""
# The bring-up kernel's config fragment (merged onto allnoconfig).
bringup_config = "bootchain/bringup.config"
# mkfs.f2fs (Alpine aarch64) in the bring-up initramfs, for restore-android.
f2fs = true

[installer]
# derived: <device.codename>-setup (state, cache and backup directory names)
name = ""
# Samsung Download mode USB id (heimdall).
download_usb = "04e8:685d"
# Partitions by PIT name that heimdall may ever write. Nothing else, ever.
flash_allow = ["BOOT", "RECOVERY"]
boot_partition = "BOOT"
recovery_partition = "RECOVERY"
# Size of boot_partition in bytes (PIT: blocks x block size), for the boot
# images' AVB footer. 0 = unknown: the installer builds no boot image.
boot_partition_bytes = 0
# GPT names on the main storage, from the live environment's console.
userdata_partition = "userdata"
metadata_partition = "metadata"
super_partition = "super"
# The main storage's whole-disk device in the live environment; the
# installer touches only its partitions.
main_disk = "sda"
# Its logical sector size in bytes: 4096 (UFS) or 512 (eMMC); the image's
# GPT is built for it.
sector_size = 4096
# Partitions the full Android backup also copies, read-only, for the
# user's safety (identity data); never written back.
backup_readonly = ["efs", "sec_efs"]
# Partitions that must never be written by anything (lower case GPT/PIT
# names): identity, keys, the signed boot chain. Extend, never shorten.
protected = [
  "bootloader", "bootloader2", "ul_keys", "ddi", "pit", "md5hdr", "efs",
  "sec_efs", "param", "up_param", "bota", "keystorage", "steady", "uh",
  "uhcfg", "blcmd", "radio", "cp_debug", "nad_refer", "persistent",
  "keyrefuge", "keydata", "dqmdbg", "vbmeta", "vbmeta_samsung", "prism",
  "optics", "omr", "spu", "cpefs", "cm", "misc", "dtbo",
]
# Vendor firmware the drivers need: without these the installer stops
# (paths relative to /lib/firmware). Samsung's files never enter git.
required_firmware = []
# Firmware paths (shell globs) left out of the image's firmware bundle.
firmware_exclude = []
# Space the first boot adds on top of the image (second /usr slot + root
# minimum), in MiB.
first_boot_extra_mib = 6528

[debug_tool]
# The shared USB debug tool (root console over USB, the tab CLI):
# ./setup.sh asks whether to install it (default yes); ask = false installs
# it without asking. --debug-tools / --no-debug-tools decide on the command line.
ask = true
remote = "https://github.com/exynos-linux/usb-debug"
# a release tag; "" = the main branch
version = ""
# sha256 of install.sh: setup.sh checks it before running it ("" = no check)
sha256 = ""
# derived: <remote>/releases/download/<version>/install.sh, or
# <remote>/raw/main/install.sh without a version
setup = ""

[console]
# The USB debug console (bring-up Linux and dev images), over USB NCM.
port = 23
shell_port = 2323
