console=tty0
loglevel=7
# Bring-up: keep what the bootloader enabled until the SoC's clock, power
# domain and regulator drivers are proven on the device (drop one at a time,
# each after an on-device test).
clk_ignore_unused
pd_ignore_unused
regulator_ignore_unused
# Never hang silently: the kernel pets the bootloader's watchdog only until
# userspace opens it; oopses and hung tasks panic, a panic reboots, and
# systemd-boot's boot counting then falls back to the previous version.
watchdog.open_timeout=120
oops=panic
hung_task_panic=1
panic=10
# Vendor firmware from the root partition (firmware-path.tmpfiles)
firmware_class.path=/var/lib/firmware
