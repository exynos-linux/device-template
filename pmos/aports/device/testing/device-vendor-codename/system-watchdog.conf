# While the system runs, PID 1 pets /dev/watchdog0 (a frozen kernel or PID 1
# resets the SoC), but there is no deadline for shutdown or reboot, which a
# slow shutdown must never turn into a reset loop. (Overrides
# duranium-usb-debug's 40-duranium-usb-debug-watchdog.conf.) The boot chain
# decides what times out the boot itself.
[Manager]
WatchdogDevice=/dev/watchdog0
RuntimeWatchdogSec=30s
RebootWatchdogSec=off
